<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>Portfolio - HYUNNE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #fcfdfa;
            font-family: 'Google Sans', 'Helvetica Neue', Arial, sans-serif;
            color: #1a1a1a;
            -webkit-text-size-adjust: 100%;
        }

        /* ── 타이틀 ── */
        .title {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            margin: 0;
            font-family: 'Google Sans', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 700;
            font-size: clamp(36px, 8vw, 70px);
            line-height: 1;
            font-style: italic;
            color: #eaebee;
            letter-spacing: 0.01em;
            pointer-events: none;
        }

        /* ── 본문 래퍼 ── */
        .portfolio-wrap {
            padding-top: 120px;
            display: flex;
            max-width: 100%;
            padding-left: 2%;
            padding-right: 2%;
            padding-bottom: 100px;
        }

        /* ── 왼쪽 메뉴 ── */
        .sidebar {
            width: 18%;
            padding-right: 20px;
            position: sticky;
            top: 120px;
            height: max-content;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .year-menu {
            font-size: 22px;
            font-weight: 500;
            color: #fcfdff;
            text-decoration: none;
            opacity: 0.4;
            transition: opacity 0.3s ease, color 0.3s ease;
        }

        .year-menu:hover, .year-menu.active {
            opacity: 1;
            color: #f57438;
        }

        /* ── 오른쪽 갤러리 : 1열 ── */
        .gallery {
            width: 82%;
            display: grid;
            grid-template-columns: 1fr;   /* 한 줄에 하나씩 */
            gap: 80px;                    /* 작업 사이 간격 */
        }

        /* 한 작업 = [이미지 | 설명] 2단 */
        .work-item {
            display: grid;
            grid-template-columns: 1.6fr 1fr;  /* 이미지 : 텍스트 비율 */
            gap: 32px;
            align-items: start;
        }

        .work-thumb {
            aspect-ratio: 4 / 3;
            background-color: #ffffff;
            border-radius: 0px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .work-item:hover .work-thumb {
            transform: translateY(-8px);
        }

        .work-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── 캡션 영역 ──
           [위치 조정]
           padding-top   : 이미지 상단 기준으로 텍스트를 아래로 내림
           padding-left  : 이미지에서 더 떨어뜨림
           [문단 간격 조정]
           각 요소의 margin-bottom = 문단 사이 여백
           line-height              = 한 문단 안의 줄 간격          */
        .work-info {
            padding-top: 70px;
            padding-left: 0;
        }

        .work-title {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.25;
            letter-spacing: -0.01em;
            margin-bottom: 4px;   /* 제목 ↔ 재료 */
        }

        .work-material {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.4;
            color: #8a8a8a;
            margin-bottom: 12px;  /* 재료 ↔ 설명 */
        }

        .work-desc {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;     /* 설명 줄 간격 */
            color: #4a4a4a;
            margin-bottom: 12px;  /* 설명 ↔ 년도 */
        }

        .work-year {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: #b0b0ae;
        }

        /* ── 모바일 (< 768px) ── */
        @media (max-width: 768px) {
            .title {
                font-size: 48px;
            }

            .portfolio-wrap {
                padding-top: 80px;
                flex-direction: column;
                padding-left: 4%;
                padding-right: 4%;
            }

            .sidebar {
                width: 100%;
                position: relative;
                top: 0;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px 24px;
                margin-bottom: 20px;
                border-bottom: 0px solid rgba(0,0,0,0);
                padding-bottom: 20px;
            }

            .year-menu {
                font-size: 24px;
            }

            .gallery {
                width: 100%;
                gap: 56px;
            }

            /* 모바일에서는 이미지 아래로 설명이 내려옴 */
            .work-item {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .work-title { font-size: 14px; }
            .work-desc  { font-size: 13.5px; }
        }
    </style>
</head>
<body>

    <h1 class="title">HYUNNE</h1>

    <div class="portfolio-wrap">

        <div class="sidebar">
            <a href="#" class="year-menu active">2026</a>
            <a href="#" class="year-menu">2025</a>
            <a href="#" class="year-menu">2024</a>
            <a href="#" class="year-menu">2023</a>
            <a href="#" class="year-menu">Archive</a>
        </div>

        <div class="gallery">

            <div class="work-item">
                <div class="work-thumb">
                    <img src="hyunne1.jpg" alt=""> 
                </div>
                <div class="work-info">
                    <h2 class="work-title">00</h2>
                    <p class="work-material">hanji / korean watercolour</p>
                    <p class="work-desc"></p>
                    <p class="work-year">2026</p>
                </div>
            </div>

            <div class="work-item">
                <div class="work-thumb"></div>
                <div class="work-info">
                    <h2 class="work-title">작업 제목</h2>
                    <p class="work-material">재료 / 사이즈</p>
                    <p class="work-desc">작업에 대한 설명이 들어가는 자리입니다.</p>
                    <p class="work-year">2026</p>
                </div>
            </div>

            <div class="work-item">
                <div class="work-thumb" style="background-color: #cdbcd8;"></div>
                <div class="work-info">
                    <h2 class="work-title">작업 제목</h2>
                    <p class="work-material">재료 / 사이즈</p>
                    <p class="work-desc">작업에 대한 설명이 들어가는 자리입니다.</p>
                    <p class="work-year">2025</p>
                </div>
            </div>

            <div class="work-item">
                <div class="work-thumb" style="background-color: #cdbcd8;"></div>
                <div class="work-info">
                    <h2 class="work-title">작업 제목</h2>
                    <p class="work-material">재료 / 사이즈</p>
                    <p class="work-desc">작업에 대한 설명이 들어가는 자리입니다.</p>
                    <p class="work-year">2025</p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
