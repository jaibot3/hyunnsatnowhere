<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyunne — works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=Gowun+Dodum&display=swap">
<style>
/* Layout: single-screen gallery. Works are camera-facing planes on a vertical orbit (a slowly rolling drum): one large work up front, one neighbour above and below; hover pauses and captions, click opens the work; small index down the left. */
:root{
  --paper:#ffffff; --ink:#28322e; --mute:#7a857f; --moss:#1f5a53; --veil:rgba(20,28,25,.62); --veil-ink:#f1f3ee; --arrow:#2f4fb8;
  --serif-en:"Newsreader","Iowan Old Style","Times New Roman",serif;
  --serif-ko:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121816;--ink:#dde2db;--mute:#859089;--moss:#8fbdb3;--veil:rgba(8,12,11,.7);--veil-ink:#eef1ec;--arrow:#8ea6f2;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121816;--ink:#dde2db;--mute:#859089;--moss:#8fbdb3;--veil:rgba(8,12,11,.7);--veil-ink:#eef1ec;--arrow:#8ea6f2;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif-ko);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);overflow:hidden;
  padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}

header{display:flex;justify-content:space-between;align-items:baseline;padding-block:22px 0;position:relative;z-index:2}
header a{color:var(--ink);text-decoration:none;font-family:var(--serif-en);font-style:italic;font-size:24px;font-weight:300}
.count{font-family:var(--serif-en);font-size:15px;color:var(--mute);letter-spacing:.08em;font-variant-numeric:tabular-nums}

.stage{position:relative;min-height:0;margin-inline:-20px;overflow:hidden;perspective:1100px;perspective-origin:50% 50%;
  touch-action:pan-x;cursor:grab;user-select:none}
.stage.drag{cursor:grabbing}
.plane{position:absolute;left:50%;top:50%;display:block;overflow:hidden;width:var(--pw);height:var(--ph);
  margin:calc(var(--ph) / -2) 0 0 calc(var(--pw) / -2);will-change:transform,opacity;
  box-shadow:0 22px 44px -30px rgba(0,0,0,.45)}
.plane img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;
  transform:scale(1.001);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.plane:hover img,.plane:focus-visible img{transform:scale(1.08)}   /* frame keeps its size; only the picture leans in */
.plane:focus-visible{outline:1px solid var(--moss);outline-offset:4px}

.info{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 12px;background:var(--veil);color:var(--veil-ink);
  display:grid;gap:3px;opacity:0;transform:translateY(4px);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
.plane:hover .info,.plane:focus-visible .info{opacity:1;transform:none}
.info .t{font-family:var(--serif-en);font-weight:300;font-size:18px;line-height:1.2}
.info .m{font-size:12px;letter-spacing:.02em;opacity:.85}

nav.index{position:fixed;left:20px;top:50%;transform:translateY(-50%);z-index:2;display:grid;gap:2px}
nav.index a{padding:2px 0;color:var(--mute);text-decoration:none;opacity:.7;
  font-family:var(--serif-en);font-size:11px;letter-spacing:.08em;font-variant-numeric:tabular-nums;transition:color .3s,opacity .3s}
nav.index a:hover,nav.index a:focus-visible{color:var(--ink);opacity:1;outline:none}
nav.index a[aria-current="true"]{color:var(--moss);opacity:1}

@media (prefers-reduced-motion:reduce){.plane img,.info{transition:none}}
</style>
</head>
<body>
<header>
  <a href="index.html">Hyunne</a>
  <span class="count" id="count" aria-live="off">00 / 14</span>
</header>

<section class="stage" id="stage" aria-label="작품"></section>

<nav class="index" id="index" aria-label="작품 번호"></nav>

<script src="works.js"></script>
<script>
const pad = n => String(n).padStart(2,"0");
const $ = id => document.getElementById(id);
const stage=$("stage"), idx=$("index"), N=WORKS.length;
const PERIOD = 90;                       // seconds for one full turn: slow roll
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

// planes: camera-facing pictures, each a link to its detail page
const planes = WORKS.map((w,i)=>{
  const a=document.createElement("a"); a.className="plane"; a.href=`work.html?w=${pad(i)}`;
  a.setAttribute("aria-label",`${w.title} 자세히 보기`);
  a.innerHTML=`<img alt="${w.title}, Hyunne" draggable="false"><span class="info"><span class="t"></span><span class="m"></span></span>`;
  const im=a.querySelector("img"); im.src=w.src;
  im.onload=()=>{ a.dataset.r = im.naturalWidth/im.naturalHeight; size(a); };
  a.querySelector(".t").textContent=w.title; a.querySelector(".m").textContent=w.meta;
  a.addEventListener("click",e=>{ if(moved) e.preventDefault(); });
  stage.appendChild(a); return a;
});
WORKS.forEach((w,i)=>{
  const l=document.createElement("a"); l.href=`work.html?w=${pad(i)}`; l.textContent=pad(i);
  l.setAttribute("aria-label",`${pad(i)}번 작품`); idx.appendChild(l);
});

// geometry: one large work up front, its neighbours peeking from above and below
let S=400, R=380, W=600;
function size(a){
  const r=+a.dataset.r||1, ph=Math.min(S, W/r);         // fit inside S tall × W wide
  a.style.setProperty("--pw", ph*r+"px"); a.style.setProperty("--ph", ph+"px");
}
function fit(){
  const h=stage.clientHeight, w=stage.clientWidth;
  S = h*.6; W = Math.min(w-(w<600?96:120), S*1.5);       // keep clear of the index on the left
  R = S*.92;
  planes.forEach(size); draw();
}
addEventListener("resize", fit);

// orbit: y-z arc; pos counts works, the front work sits at z=0 and the rest fall back along the arc
const ARC = .8;                                          // radians between neighbours
let pos=0, paused=false, last=0, front=-1;
function draw(){
  planes.forEach((p,i)=>{
    let d = ((i-pos)%N + N) % N; if(d > N/2) d -= N;      // signed distance from the front work
    const t = Math.max(-1.9, Math.min(1.9, d*ARC)), a=Math.abs(d);
    const y = Math.sin(t)*R, z = (Math.cos(t)-1)*R;       // d>0 waits below, d<0 has rolled past above
    p.style.transform = `translate3d(0,${y.toFixed(1)}px,${z.toFixed(1)}px)`;
    p.style.opacity = a<=1 ? 1 : Math.max(0, 1-(a-1)/.6);  // only one above and one below stay visible
    p.style.visibility = a>1.6 ? "hidden" : "";
    p.style.zIndex = 100-Math.round(a*10);
    p.tabIndex = a<.5 ? 0 : -1;
  });
  const f = ((Math.round(pos)%N)+N)%N;
  if(f!==front){
    front=f; $("count").textContent=`${pad(front)} / ${pad(N-1)}`;
    [...idx.children].forEach((l,i)=>l.setAttribute("aria-current", i===front));
  }
}
function tick(now){
  const dt = last ? Math.min((now-last)/1000, .1) : 0; last=now;
  if(!paused && !dragging && !still) pos += dt*N/PERIOD;  // front works roll upward
  draw(); requestAnimationFrame(tick);
}

// hover or keyboard focus on a plane holds the drum still so the caption can be read
stage.addEventListener("pointerover",e=>{ if(e.pointerType==="mouse") paused=!!e.target.closest(".plane"); });
stage.addEventListener("pointerleave",()=>{ paused=false; });
stage.addEventListener("focusin",()=>{ paused=true; });
stage.addEventListener("focusout",()=>{ paused=false; });

// drag vertically to roll it by hand
let dragging=false, moved=false, py=0;
stage.addEventListener("pointerdown",e=>{ dragging=true; moved=false; py=e.clientY; });
addEventListener("pointermove",e=>{
  if(!dragging) return; const dy=e.clientY-py;
  if(Math.abs(dy)>4){ moved=true; stage.classList.add("drag"); }
  if(moved){ pos -= dy/(R*ARC*1.2); py=e.clientY; }
});
addEventListener("pointerup",()=>{ dragging=false; stage.classList.remove("drag"); setTimeout(()=>moved=false,0); });
stage.addEventListener("wheel",e=>{ e.preventDefault(); pos += e.deltaY/(R*ARC*3); },{passive:false});

fit(); requestAnimationFrame(tick);
</script>
</body>
</html>
